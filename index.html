<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ACG 存档点</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23191D27%22/%3E%3Crect%20x%3D%229%22%20y%3D%2217%22%20width%3D%2220%22%20height%3D%2230%22%20rx%3D%223%22%20fill%3D%22%232A54E4%22%20transform%3D%22rotate%28-12%2019%2032%29%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2215%22%20width%3D%2220%22%20height%3D%2230%22%20rx%3D%223%22%20fill%3D%22%23DC3A6E%22%20stroke%3D%22%23191D27%22%20stroke-width%3D%222%22/%3E%3Crect%20x%3D%2235%22%20y%3D%2217%22%20width%3D%2220%22%20height%3D%2230%22%20rx%3D%223%22%20fill%3D%22%23B87E00%22%20stroke%3D%22%23191D27%22%20stroke-width%3D%222%22%20transform%3D%22rotate%2812%2045%2032%29%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --surface:#FFFFFF; --raised:#FFFFFF;
  --ink:#191D27; --ink-2:#474E60; --ink-3:#737A8C; --line:#CBD0D8;
  --a:#2A54E4; --a-soft:#D6DFFC;
  --c:#DC3A6E; --c-soft:#F9D9E3;
  --g:#B87E00; --g-soft:#F5E4B8;
  --ok:#1D7F55; --warn:#A8650A; --shade:rgba(20,24,34,.42);
  --display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --heavy:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --acc:var(--a); --acc-soft:var(--a-soft);
}
[data-sec="A"]{--acc:var(--a);--acc-soft:var(--a-soft)}
[data-sec="C"]{--acc:var(--c);--acc-soft:var(--c-soft)}
[data-sec="G"]{--acc:var(--g);--acc-soft:var(--g-soft)}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.app{display:grid;grid-template-columns:132px minmax(0,1fr);min-height:100vh}

/* ---------- rail: binder index tabs ---------- */
.rail{background:#F6F7F9;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding-block:18px;padding-left:16px;border-right:1px solid var(--line)}
.brand{border:0;background:none;padding:0 0 14px;cursor:default;text-align:left;user-select:none}
.brand b{display:block;font-family:var(--display);font-size:26px;font-weight:400;line-height:1}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3)}
.tab{display:grid;grid-template-columns:auto 1fr;align-items:end;column-gap:8px;border:0;background:transparent;text-align:left;cursor:pointer;padding:10px 12px 10px 10px;border-radius:10px 0 0 10px;margin-right:-1px;color:var(--ink-3);position:relative}
.tab .L{font-family:var(--heavy);font-size:40px;line-height:.9;grid-row:span 2}
.tab .zh{font-size:12px;font-weight:700;letter-spacing:.08em}
.tab .n{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-right-color:var(--surface)}
.tab[aria-selected="true"] .L{color:var(--acc)}
.tab[data-k="A"]{--acc:var(--a)} .tab[data-k="C"]{--acc:var(--c)} .tab[data-k="G"]{--acc:var(--g)}
.rail .foot{margin-top:auto;padding-right:12px;font-size:11px;color:var(--ink-3);line-height:1.5}

/* ---------- main ---------- */
main{background:var(--surface);min-width:0;padding-block:22px 60px;padding-inline:clamp(16px,3vw,40px)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;padding-bottom:18px}
.head h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,64px);line-height:.95;display:flex;align-items:baseline;gap:14px}
.head h1 span{font-family:var(--heavy);font-size:.34em;letter-spacing:.12em;color:var(--acc)}
.head p{margin:0;color:var(--ink-2);max-width:40ch;font-size:13px}
.sample{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);border:1px dashed var(--acc);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px}

.stat{display:flex;flex-direction:column;gap:8px;padding:14px 0 18px;border-top:2px solid var(--ink)}
.bar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block}

/* toolbar */
.tools{position:sticky;top:0;z-index:5;background:var(--surface);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:36px}
.search input{border:0;background:none;outline:none;width:100%;height:100%}
.search svg{flex:none;color:var(--ink-3)}
.sel{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:0 8px}
.msel{position:relative;padding:0}
.msel summary{list-style:none;height:34px;display:flex;align-items:center;gap:6px;padding:0 28px 0 10px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.msel summary::-webkit-details-marker{display:none}
.msel summary::after{content:"";position:absolute;right:11px;top:14px;width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(45deg)}
.msel[open] summary::after{transform:rotate(-135deg);top:17px}
.msel .menu{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:min(420px,calc(100vw - 32px));max-height:min(60vh,460px);overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px -12px rgba(20,24,34,.35);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.msel fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.msel legend{width:100%;padding:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
.msel .opt{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 7px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.msel .opt input{margin:0;accent-color:var(--acc)}
.msel .opt:has(input:checked){border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.msel .opt em{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.65}
.msel .clear{align-self:flex-start;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.msel .none{margin:0;font-size:13px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip em{font-style:normal;font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:36px}
.seg button{border:0;background:var(--raised);padding:0 10px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.r18{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 8px;border:1px dashed var(--c);border-radius:8px;color:var(--c);font-size:12px;font-weight:700;cursor:pointer;background:transparent}
.r18[hidden]{display:none}
.r18 .knob{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.r18 .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--raised);transition:transform .15s}
.r18[aria-checked="true"] .knob{background:var(--c)}
.r18[aria-checked="true"] .knob::after{transform:translateX(12px)}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- cover wall ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:22px 16px}
.card{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;content-visibility:auto;contain-intrinsic-size:138px 280px}
.card:hover .cover{transform:translateY(-3px);box-shadow:0 8px 0 -3px var(--acc)}
.card .ti{font-weight:500;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3);min-height:18px}
.card .meta .d{font-family:var(--mono)}

.cover{position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:3px;overflow:hidden;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);transition:transform .18s,box-shadow .18s}
.cover::before{content:"";position:absolute;inset:0}
.cover.v0::before{background-image:radial-gradient(color-mix(in srgb,var(--acc) 70%,transparent) 1.3px,transparent 1.7px);background-size:6px 6px;-webkit-mask:linear-gradient(160deg,transparent 25%,#000 90%);mask:linear-gradient(160deg,transparent 25%,#000 90%)}
.cover.v1::before{background:repeating-linear-gradient(-55deg,color-mix(in srgb,var(--acc) 55%,transparent) 0 2px,transparent 2px 8px)}
.cover.v2::before{background:radial-gradient(circle at 30% 68%,var(--acc) 0 30%,transparent 30.5%),radial-gradient(color-mix(in srgb,var(--acc) 50%,transparent) 1.2px,transparent 1.6px) 0 0/5px 5px}
.cover.v3::before{background:linear-gradient(var(--acc) 0 0) 0 62%/100% 18% no-repeat,radial-gradient(color-mix(in srgb,var(--acc) 45%,transparent) 1.1px,transparent 1.5px) 0 0/7px 7px}
.cover .vt{position:absolute;top:8%;right:9%;max-height:80%;writing-mode:vertical-rl;font-family:var(--display);line-height:1.05;background:var(--raised);color:var(--ink);padding:.45em .22em;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.cover .no{position:absolute;left:7%;bottom:6%;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;background:var(--ink);color:var(--surface);padding:1px 5px;border-radius:2px}
.cover .rt{position:absolute;left:7%;top:6%;font-family:var(--display);font-size:15px;line-height:1;color:var(--raised);background:var(--ink);padding:3px 5px 2px;transform:rotate(-6deg)}
.cover .adult{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-family:var(--heavy);font-size:12px;letter-spacing:.2em;color:#fff;background:var(--c)}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-done{color:var(--ink-2);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.p-live{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.p-hold{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.p-wish{color:var(--ink-3);border:1px dashed var(--ink-3)}
.p-wish::before{background:transparent;border:1px solid currentColor}
.p-move{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}

/* ---------- list view ---------- */
.list{overflow-x:auto}
.list table{width:100%;border-collapse:collapse;min-width:980px;table-layout:fixed}
.list th{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list tr{cursor:pointer}
.list tbody tr:hover td{background:var(--acc-soft)}
.list .mini{width:34px}
.list .mini .cover{border-radius:2px}
.list .mini .cover .vt,.list .mini .cover .no,.list .mini .cover .rt{display:none}
.list .nm{font-weight:500;font-size:14.5px}
.list .tags{display:flex;gap:4px;align-items:center;overflow:hidden}
.list .more{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.list .nm small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;background:var(--acc-soft);color:var(--ink);margin:1px 3px 1px 0}
.rating{font-family:var(--display);font-size:16px}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--ink-2)}

/* ---------- drawer ---------- */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.7,.2,1);overflow-y:auto;border-left:2px solid var(--ink)}
.drawer.on{transform:none}
.dx{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1}
.dx .mono{letter-spacing:.08em}
.close{border:1px solid var(--line);background:var(--raised);border-radius:8px;height:32px;padding:0 12px;cursor:pointer}
.dbody{padding:22px 20px 40px;display:flex;flex-direction:column;gap:26px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start}
.hero .cover .vt{font-size:22px}
.hero h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;text-wrap:balance}
.hero .sub{color:var(--ink-3);font-size:13px;margin-bottom:10px}
.hero .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.16em;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:10px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 14px;margin:0}
.kv dt{color:var(--ink-3);font-size:12.5px}
.kv dd{margin:0}
.kv .miss{color:var(--ink-3);font-style:italic;font-size:12.5px}
.prog{display:flex;align-items:center;gap:10px}
.prog .track{flex:1;max-width:220px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--acc)}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.person{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
.ava{width:56px;height:56px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:radial-gradient(color-mix(in srgb,var(--acc) 50%,transparent) 1px,transparent 1.4px) 0 0/4px 4px,var(--acc-soft)}
.person b{display:block;font-weight:500;font-size:13px;line-height:1.3}
.person span{font-size:11.5px;color:var(--ink-3)}
.note{font-size:12px;color:var(--ink-3);border-left:3px solid var(--acc);padding:6px 10px;background:var(--acc-soft);border-radius:0 6px 6px 0}
.quote{font-family:var(--display);font-size:22px;line-height:1.3;margin:0}

/* PIN dialog */
dialog{border:2px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);padding:22px;width:min(320px,calc(100% - 32px))}
dialog::backdrop{background:var(--shade)}
dialog h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:24px}
dialog p{margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}
dialog input{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--raised);text-align:center;font-family:var(--mono);font-size:20px;letter-spacing:.5em}
dialog .err{color:var(--c);font-size:12px;min-height:18px;margin-top:6px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end}
dialog .acts button{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--raised);cursor:pointer}
dialog .acts .go{background:var(--ink);color:var(--surface);border-color:var(--ink)}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 16px 0;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .brand{padding:0 10px 8px 0}
  .brand small{display:none}
  .tab{border-radius:10px 10px 0 0;margin-right:0;margin-bottom:-1px;padding:6px 10px}
  .tab[aria-selected="true"]{border-right-color:var(--line);border-bottom-color:var(--surface)}
  .tab .L{font-size:26px}
  .tab .n{display:none}
  .rail .foot{display:none}
  .wall{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 10px}
  .hero{grid-template-columns:110px 1fr}
  .hero h2{font-size:26px}
  .count{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:var(--acc-soft)}
.cover .no,.cover .rt,.cover .adult{z-index:2}
.cover.has-img .vt{display:none}
.skel .cover{animation:pulse 1.2s ease-in-out infinite alternate}
.skel .ti{height:12px;width:80%;background:var(--line);border-radius:3px}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid var(--line);background:#F6F7F9;color:var(--ink-2)}
.banner.err{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:var(--c-soft);color:var(--ink)}
.banner.r18mode{border:1px dashed var(--c);background:transparent;color:var(--c);font-weight:700}
.banner button{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.sync{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px}
.links a:hover{border-color:var(--acc);color:var(--acc)}
.score{font-family:var(--mono);font-weight:600}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.intro{margin:0;white-space:pre-line;line-height:1.7;color:var(--ink-2)}
.rev{width:36px;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.rev[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rev[aria-pressed="true"] svg{transform:scaleY(-1)}
.empty a{color:var(--acc)}
</style>

<div class="app">

/* ---------- loading ---------- */
async function queryView(view){
  const rows=[]; let cursor=null;
  do{
    const data={mode:"view",view_url:view,page_size:100};
    if(cursor)data.start_cursor=cursor;
    let res;
    try{ res=await mcp.callTool(NOTION,TOOL,{data},{cache:{staleTime:120000,gcTime:86400000}}); }
    catch(err){
      if(err&&err.retryable){await new Promise(r=>setTimeout(r,(err.retryAfterMs||1500)+Math.random()*800));res=await mcp.callTool(NOTION,TOOL,{data})}
      else throw err;
    }
    const p=res.payload||{};
    rows.push(...(p.results||[]));
    cursor=p.has_more?p.next_cursor:null;
  }while(cursor);
  return rows;
}

function errorText(err){
  switch(err&&err.code){
    case "needs_reauth": return "Notion 连接已失效。到 claude.ai「设置 → Connectors」重新连接 Notion，再刷新本页。";
    case "server_not_connected": case "selection_required": return "没有找到 Notion 连接。到 claude.ai「设置 → Connectors」添加 Notion，再刷新本页。";
    case "not_in_manifest": case "consent_required": return "本页还没有获得读取 Notion 的许可。点「重试」后在弹窗里允许。";
    case "blocked_by_policy": case "approval_required": return "当前账号的策略不允许本页读取 Notion。";
    default: return "读取 Notion 失败："+((err&&err.message)||"未知错误");
  }
}

let r18Key = null;   // public build: AES key derived from the PIN; R18 originals are decrypted with it on demand
const R18IMG = {};
async function origSrc(u){
  if(!/^r18\//.test(u))return u;
  const b=new Uint8Array(await (await fetch(u)).arrayBuffer());
  return URL.createObjectURL(new Blob([await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},r18Key,b.slice(12))]));
}
function cover(r,k,big,eager){
  const v=hash(r.t||"?")%4, t=(r.t||"").replace(/\s+/g,""), len=[...t].length, shown=len>11?[...t].slice(0,10).join("")+"…":t;
  const fs=big?22:(len<=4?21:len<=7?17:14);
  const im=imgOf(r), img=im?`<img src="${esc(im[0])}" alt=""${eager||big?` fetchpriority="high"`:` loading="lazy"`} decoding="async">`:"";
  return `<div class="cover v${v}${img?" has-img":""}">${img}<span class="vt" style="font-size:${fs}px">${esc(shown)}</span>`+
    (STAMP.has(r.e)?`<span class="rt">${esc(r.e.slice(0,2))}</span>`:"")+(S.adult?`<span class="adult">R18</span>`:"")+`</div>`;
}

function filtered(){
  const q=S.q.trim().toLowerCase();
  const rows=items(S.sec).filter(r=>{
    if(S.st&&r.st!==S.st)return false;
    if(S.tag.length){   // OR inside a group, AND across groups
      const by={};S.tag.forEach(t=>(by[t[0]]=by[t[0]]||[]).push(t.slice(2)));
      if(by.c&&!by.c.includes(r.country))return false;
      if(by.w&&!by.w.includes(r.work))return false;
      if(by.k&&!by.k.includes(r.kind||"未分类"))return false;
      if(by.g&&!by.g.some(v=>r.g.includes(v)))return false;
    }
    if(!q)return true;
    return [r.t,r.s,r.e,r.orig,...r.g,...r.plat,...r.org.flat(),...r.cast.flat()].join(" ").toLowerCase().includes(q);
  });
  const key={rec:(a,b)=>b.o-a.o,date:(a,b)=>(b.d||"0").localeCompare(a.d||"0")||b.o-a.o,
    name:(a,b)=>a.t.localeCompare(b.t,"zh-Hans-CN"),prog:(a,b)=>(b.p??-1)-(a.p??-1),score:(a,b)=>(b.score??-1)-(a.score??-1)}[S.sort];
  rows.sort(key);
  return S.rev?rows.reverse():rows;
}

$("vGrid").onclick=()=>{S.view="grid";$("vGrid").setAttribute("aria-pressed",true);$("vList").setAttribute("aria-pressed",false);renderView()};
$("vList").onclick=()=>{S.view="list";$("vList").setAttribute("aria-pressed",true);$("vGrid").setAttribute("aria-pressed",false);renderView()};
$("view").onclick=e=>{const el=e.target.closest("[data-i]");if(el)openItem(+el.dataset.i)};
$("view").onkeydown=e=>{if(e.key==="Enter"){const el=e.target.closest("tr[data-i]");if(el)openItem(+el.dataset.i)}};
$("shade").onclick=closeItem;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeItem()});

/* hidden switch: triple-click the brand, or Alt+Shift+H */
function setAdult(on){
  S.adult=on;S.st="";S.tag=[];closeItem();
  $("r18").setAttribute("aria-checked",on);
  if(on){banner("R18 模式 · 只显示私密条目，普通条目已隐藏","r18mode");loadR18()}else banner("");
  render();
}
let clicks=0,timer;
function reveal(){$("r18").hidden=!$("r18").hidden;if($("r18").hidden&&S.adult)setAdult(false)}
$("brand").onclick=()=>{clicks++;clearTimeout(timer);timer=setTimeout(()=>clicks=0,500);if(clicks>=3){clicks=0;reveal()}};
document.addEventListener("keydown",e=>{if(e.altKey&&e.shiftKey&&e.code==="KeyH")reveal()});
$("r18").onclick=()=>{if(S.adult){setAdult(false);return}$("pinInput").value="";$("pinErr").textContent="";$("pin").showModal()};
$("pinCancel").onclick=()=>$("pin").close();
async function checkPin(v){
  if(MODE!=="public")return v===PIN;
  if(r18Loaded)return true;
  try{
    $("pinErr").textContent="正在解锁…";
    const b=new Uint8Array(await (await fetch("r18/data.bin")).arrayBuffer());
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(v),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b.slice(0,16),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},key,b.slice(28))));
    r18Key=key;Object.assign(R18IMG,d.img);Object.assign(window.CHAR_IMG||(window.CHAR_IMG={}),d.chars);
    R18.A=[];R18.C=[];R18.G=[];
    d.rows.forEach(r=>{const k=SEC_OF[plain(r["板块"])]||"A";R18[k].push(toItem(r,k,R18[k].length))});
    r18Loaded=true;$("pinErr").textContent="";return true;
  }catch{return false}
}
$("pinForm").onsubmit=async e=>{
  e.preventDefault();
  if(await checkPin($("pinInput").value)){$("pin").close();setAdult(true)}
  else{$("pinErr").textContent="PIN 不对，再试一次。";$("pinInput").select()}
};

/* ---------- boot ---------- */
if(SNAP){["A","C","G"].forEach(k=>DATA[k]=SNAP[k].map((r,i)=>toItem(r,k,i)));syncedAt=new Date(SNAP.at)}
if(MODE==="private")try{const snap=JSON.parse(localStorage.getItem("acg-snap-v1")||"null");if(snap&&snap.DATA&&(!SNAP||snap.at>SNAP.at)){Object.assign(DATA,snap.DATA);syncedAt=new Date(snap.at)}}catch{}
render();
if(MODE==="private")(async()=>{
  try{mcp=window.claude&&await window.claude.use("mcp")}catch{mcp=null}
  loadArchive();
})();
</script>
